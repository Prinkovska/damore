<!--
  D'AMORE · КУРСОР-СЕРЦЕ НА ВСЬОМУ САЙТІ
  ─────────────────────────────────────────────────────────────────────────────
  ЯК ПІДКЛЮЧИТИ (один раз на весь сайт):
  Tilda → Налаштування сайту → «Ще» → «HTML-код для вставки в HEAD» → «Редагувати код» → вставити весь цей код → Зберегти → Опублікувати ВСІ сторінки.
  (Тоді курсор з'являється на всіх сторінках. Вставка коду в HEAD потребує платного тарифу Tilda; на Free – інакше, див. нижче.)
  На Free-тарифі: вставити цей код блоком T123 «HTML-код» на кожну сторінку або в спільний хедер сторінок.
  Цей код сумісний із курсором у hero: якщо вони обидва на сторінці, працює лише один (дублів не буде).
  Працює тільки з мишею/тачпадом (на телефоні не показується). Гострий кінець серця = точка кліку.
-->
<style>
  html.dm-nocur, html.dm-nocur *{cursor:none!important}
  .dm-cur{
    position:fixed; left:0; top:0; width:16px; height:24px; z-index:1000000; pointer-events:none; opacity:0;
    background:center/contain no-repeat; will-change:transform; transition:opacity .25s ease;
    transform-origin:50% 100%;
    filter:drop-shadow(0 3px 5px rgba(120,25,15,.28));
  }
</style>
<script>
(function(){
  'use strict';
  /* ═══════════ CONFIG ═══════════ */
  var CURSOR_IMG = '../../assets/img/cursor.png';   // картинка курсора (серце, гострий кінець вниз)
  var CUR_ANGLE  = 135;                                                              // кут: 135° = гострий кінець дивиться вгору-вліво, як у стрілки

  if (window.__dmCursor) return;                                                     // вже запущено (наприклад, у hero)
  if (!window.matchMedia || !matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  window.__dmCursor = 1;

  var root = document.documentElement;
  function start(){
    var im = new Image();
    im.onload = function(){
      var el = document.createElement('div');
      el.className = 'dm-cur';
      el.style.backgroundImage = 'url("' + CURSOR_IMG + '")';
      document.body.appendChild(el);
      var x=-100,y=-100,tx=-100,ty=-100,sc=1,tsc=1,rot=0,shown=false;
      window.addEventListener('mousemove', function(e){
        tx = e.clientX; ty = e.clientY;
        if (!shown){ shown = true; x = tx; y = ty; root.classList.add('dm-nocur'); el.style.opacity = 1; }
        var t = e.target;
        tsc = (t && t.closest && t.closest('a,button,input,textarea,select,label,summary,[role=button],[role=tab],.t-btn')) ? 1.45 : 1;
      }, {passive:true});
      window.addEventListener('mousedown', function(){ tsc *= .82; });
      window.addEventListener('mouseup',   function(){ tsc = Math.max(1, tsc / .82); });
      document.addEventListener('mouseleave', function(){ el.style.opacity = 0; });
      document.addEventListener('mouseenter', function(){ if (shown) el.style.opacity = 1; });
      (function loop(){
        var dx = tx - x;
        x += dx * .28; y += (ty - y) * .28; sc += (tsc - sc) * .18;
        rot += (Math.max(-16, Math.min(16, dx * .6)) - rot) * .2;
        el.style.transform = 'translate3d('+x+'px,'+y+'px,0) translate(-50%,-100%) rotate('+(CUR_ANGLE + rot)+'deg) scale('+sc+')';
        requestAnimationFrame(loop);
      })();
    };
    im.src = CURSOR_IMG;
  }
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
<!--
  D'AMORE · ВЕРХНІЙ БІГУЧИЙ РЯДОК (Tilda → T123 «HTML-код», ставиться у Шапку над меню)
  Тексти й швидкість змінюються у блоці CONFIG унизу в <script>.
-->
<style>
  .dm-top{
    --c1:#7A1D14; --c2:#B4422F; --c3:#8E271B; --c4:#CF6A55;     /* відтінки «шовку» (ті самі, що в кнопки) */
    --dm-top-fg:#FFF4EC;
    position:relative; width:100%; height:38px; overflow:hidden; isolation:isolate;
    background:var(--c1); color:var(--dm-top-fg);
    font:500 12.5px/1 'Onest','Helvetica Neue',Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase;
    box-shadow:inset 0 1px 0 rgba(255,225,215,.28), inset 0 -7px 12px rgba(50,6,4,.28);
    -webkit-user-select:none; user-select:none;
  }
  .dm-top-silk{                            /* тканина, що повільно переливається */
    position:absolute; inset:-70% -10%; z-index:0; pointer-events:none;
    background:
      radial-gradient(38% 130% at 18% 45%, rgba(255,205,190,.55), transparent 62%),
      radial-gradient(34% 120% at 66% 60%, rgba(255,190,175,.42), transparent 64%),
      radial-gradient(30% 110% at 96% 30%, rgba(255,205,190,.36), transparent 62%),
      linear-gradient(100deg,var(--c1) 0%,var(--c2) 14%,var(--c3) 27%,var(--c4) 40%,var(--c3) 54%,var(--c2) 68%,var(--c4) 82%,var(--c1) 100%);
    background-size:200% 200%,220% 200%,240% 200%,300% 100%;
    animation:dmTopSilk 14s ease-in-out infinite alternate;
  }
  @keyframes dmTopSilk{
    0%  {background-position:0% 0%,100% 100%,0% 100%,0% 0%}
    100%{background-position:100% 100%,0% 0%,100% 0%,100% 0%}
  }
  .dm-top-sheen{                           /* відблиск, що пробігає смугою */
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(105deg,transparent 36%,rgba(255,236,226,0) 41%,rgba(255,236,226,.42) 50%,rgba(255,236,226,0) 59%,transparent 64%);
    transform:translateX(-120%) skewX(-12deg);
    animation:dmTopSheen 8s cubic-bezier(.5,0,.3,1) 1s infinite;
  }
  @keyframes dmTopSheen{0%{transform:translateX(-120%) skewX(-12deg)} 60%,100%{transform:translateX(120%) skewX(-12deg)}}
  .dm-top-clip{                            /* текст + м'яке згасання по краях */
    position:absolute; inset:0; z-index:2; display:flex; align-items:center; overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 clamp(24px,8vw,120px),#000 calc(100% - clamp(24px,8vw,120px)),transparent);
            mask-image:linear-gradient(90deg,transparent,#000 clamp(24px,8vw,120px),#000 calc(100% - clamp(24px,8vw,120px)),transparent);
  }
  .dm-top-track{
    display:flex; flex:none; width:max-content; will-change:transform;
    animation:dmTick var(--dm-d,40s) linear infinite;
  }
  .dm-top:hover .dm-top-track{animation-play-state:paused}
  @keyframes dmTick{to{transform:translate3d(calc(var(--dm-w,1000px) * -1),0,0)}}
  .dm-top-group{display:flex; flex:none; align-items:center}
  .dm-top-item{display:inline-flex; align-items:center; white-space:nowrap; padding:0 clamp(18px,2.4vw,40px)}
  .dm-top-item:last-child{padding-right:clamp(18px,2.4vw,40px)}
  .dm-top-item svg{width:13px; height:13px; margin-left:clamp(36px,4.8vw,80px); flex:none; fill:currentColor}
  @media (max-width:767px){
    .dm-top{height:34px; font-size:11px; letter-spacing:.11em}
  }
</style>

<div class="dm-top" id="dm-top" role="region" aria-label="Переваги">
  <i class="dm-top-silk"></i>
  <i class="dm-top-sheen"></i>
  <div class="dm-top-clip"><div class="dm-top-track" id="dm-top-track"></div></div>
</div>

<script>
(function(){
  'use strict';

  /* ═══════════ CONFIG ═══════════ */
  var ITEMS = [
    'Безкоштовна доставка',
    'Подарунки до замовлення',
    'Пробники в подарунок',
    'Миттєва відправка'
  ];
  var SPEED = 38;                       // px/с — швидкість руху (менше = повільніше)
  var SEP   = 'heart';                  // роздільник: 'heart' (серце) · 'spark' (іскорка) · 'dot' (крапка) · 'none' (без)

  var track = document.getElementById('dm-top-track');
  var SEPS = {
    heart: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
    spark: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 5.9 4.6 9.6 10.5 10.5-5.9.9-9.6 4.6-10.5 10.5C11.1 16.6 7.4 12.9 1.5 12 7.4 11.1 11.1 7.4 12 1.5z"/></svg>',
    dot:   '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/></svg>',
    none:  ''
  };
  var HEART = SEPS[SEP] || SEPS.heart;

  function group(hidden){
    var g = document.createElement('div');
    g.className = 'dm-top-group';
    if (hidden) g.setAttribute('aria-hidden','true');
    g.innerHTML = ITEMS.map(function(t){ return '<span class="dm-top-item">'+t+HEART+'</span>'; }).join('');
    return g;
  }

  function build(){
    track.innerHTML = '';
    track.style.animation = 'none';
    var first = group(false);
    track.appendChild(first);
    var one = first.getBoundingClientRect().width;
    if (!one) return;
    var need = Math.ceil((window.innerWidth * 1.1) / one);       // скільки груп потрібно, щоб заповнити екран
    for (var i=1;i<need;i++) track.appendChild(group(true));
    var setW = one * need;                                       // ширина одного повного «набору»
    for (var j=0;j<need;j++) track.appendChild(group(true));     // другий такий самий набір – для безшовного кола
    track.style.setProperty('--dm-w', setW+'px');
    track.style.setProperty('--dm-d', (setW / SPEED)+'s');
    void track.offsetWidth;
    track.style.animation = '';
  }

  var go = function(){ build(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  var rz; window.addEventListener('resize', function(){ clearTimeout(rz); rz = setTimeout(build, 200); });
})();
</script>

<!--

    position:fixed; left:0; right:0; top:var(--h); bottom:0; z-index:8990; overflow:auto; -webkit-overflow-scrolling:touch;
    background:var(--cream); padding:10px clamp(20px,6vw,40px) 40px; box-sizing:border-box;
    opacity:0; visibility:hidden; transform:translateY(-10px); transition:opacity .4s ease, transform .5s cubic-bezier(.2,.8,.2,1), visibility 0s linear .4s;
  }
  .dmh-mob.open{opacity:1; visibility:visible; transform:none; transition-delay:0s}
  .dmh-mob a,.dmh-mob button{font-family:'Onest',sans-serif}
  .dmh-m-i{
    display:flex; align-items:center; justify-content:space-between; width:100%; padding:18px 0; border:0; border-bottom:1px solid rgba(67,61,60,.1);
    background:none; font:500 22px/1.2 'Onest',sans-serif; color:var(--graph); text-decoration:none; cursor:pointer; text-align:left;
  }
  .dmh-m-i.on{color:var(--red)}
  .dmh-m-i .dmh-chev{width:14px; height:14px}
  .dmh-m-acc.open>.dmh-m-i .dmh-chev{transform:rotate(180deg)}
  .dmh-m-sub{display:none; padding:4px 0 10px 14px; border-bottom:1px solid rgba(67,61,60,.1)}
  .dmh-m-acc.open .dmh-m-sub{display:block}
  .dmh-m-sub a{display:flex; align-items:center; justify-content:space-between; padding:13px 0; font:400 17px/1.2 'Onest',sans-serif; color:var(--graph); text-decoration:none}
  .dmh-m-sub a.hot{color:var(--red); font-weight:500}
  .dmh-m-sub a .b{font:400 11.5px/1 'Onest',sans-serif; letter-spacing:.06em; color:rgba(67,61,60,.55); background:rgba(67,61,60,.07); padding:5px 10px; border-radius:99px}
  .dmh-m-foot{margin-top:26px; display:flex; flex-direction:column; gap:18px; align-items:flex-start}
  .dmh-m-foot .dmh-cta{width:100%; justify-content:center; padding:17px 26px; font-size:15px}
  .dmh-m-ig{font:400 15px/1 'Onest',sans-serif; color:rgba(67,61,60,.8); text-decoration:none; border-bottom:1px solid rgba(67,61,60,.3); padding-bottom:3px}
  html.dmh-lock,html.dmh-lock body{overflow:hidden!important}

  /* ───── режим «накласти на hero» (CONFIG.overlay) ───── */
  .dmh-wrap.dmh-over{height:0}
  .dmh-wrap.dmh-over .dmh{position:absolute; top:0; left:0; right:0; background:transparent; border-bottom-color:transparent}
  .dmh-wrap.dmh-over .dmh.stuck{position:fixed; background:rgba(246,242,238,.88); border-bottom-color:rgba(67,61,60,.09)}

  @media (max-width:1024px){
    .dmh-wrap{--h:54px}
    .dmh-in{column-gap:12px}
    .dmh-side.l .dmh-link,.dmh-side.l .dmh-dd,.dmh-side.r .dmh-link,.dmh-side.r .dmh-dd,.dmh-side.r .dmh-cta,.dmh-side.r .dmh-ig{display:none}
    .dmh-burger{display:block}
    .dmh-logo img{height:22px}
    .dmh-side.l{justify-content:flex-start}
  }
  @media (min-width:1025px){ .dmh-mob,.dmh-burger{display:none!important} }
  @media (prefers-reduced-motion:reduce){ .dmh-sub,.dmh-mob{transition-duration:.01s} }
</style>

<div class="dmh-wrap" id="dmh-wrap">
  <header class="dmh" id="dmh">
    <div class="dmh-in">
      <div class="dmh-side l" id="dmh-l">
        <button class="dmh-burger" id="dmh-burger" type="button" aria-label="Відкрити меню" aria-expanded="false" aria-controls="dmh-mob"><i></i><i></i></button>
      </div>
      <a class="dmh-logo" id="dmh-logo" href="../../" aria-label="D'AMORE — на головну"><img alt="D'AMORE"></a>
      <div class="dmh-side r" id="dmh-r"></div>
    </div>
  </header>
  <div class="dmh-mob" id="dmh-mob" aria-hidden="true"></div>
</div>

<script>
(function(){
  'use strict';

  /* ═══════════ CONFIG · пункти меню ═══════════ */
  var CONFIG = {
    logo : '../../assets/img/logo_damore.png',   // логотип (Cloudinary). Якщо не завантажиться – з’явиться текст D’AMORE
    overlay : false,                              // true = шапка прозора й лежить поверх першого екрана; false = окремим рядком над ним
    home : '../../',                                  // куди веде логотип
    cart : '#demo-cart',
    cartCounter : true,                          // значок із кількістю товарів біля кошика (читає кошик Tilda)
    cartPage : '',    // сторінка з магазином (де є кошик): на інших сторінках іконка веде сюди й відкриває кошик                          // значок із кількістю товарів біля кошика (читає кошик Tilda)                             // іконка кошика (у Tilda #order відкриває кошик)
    hideTildaCartIcon : true,                     // true = ховати власну плаваючу іконку кошика Tilda (залишається лише наша в меню)
    instagram : 'https://www.instagram.com/the_trend.studio_storoj/',   // Instagram: іконка в шапці (комп'ютер) і посилання в мобільній панелі
    cta  : { t:'Обрати догляд', h:'../../catalog/' },
    left : [
      { t:'Головна', h:'../../' },
      { t:'Продукція', h:'../../#dm-ct', sub:[
        { t:'Холодна реконструкція',    h:'../../catalog/cold-reconstruction/', hot:true },
        { t:'Домашній догляд',          h:'../../catalog/home-care/',   soon:true },
        { t:'Догляд за тілом',          h:'../../catalog/body-care/',   soon:true },
        { t:'Аксесуари',                h:'../../catalog/accessories/', soon:true },
        { t:'Сертифікати та подарунки', h:'../../catalog/gifts/',       soon:true }
      ]},
      { t:'Про бренд', h:'../../about/' }
    ],
    right: [
      { t:'Блог',      h:'../../blog/' }               // «Співпраця» поки без сторінки – прибрано
    ]
  };

  /* ═══════════ побудова ═══════════ */
  var $ = function(id){ return document.getElementById(id); };
  var wrap = $('dmh-wrap'), hd = $('dmh'), L = $('dmh-l'), R = $('dmh-r'), mob = $('dmh-mob'), burger = $('dmh-burger');
  var CHEV = '<svg class="dmh-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.2l4 4 4-4"/></svg>';
  var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
  var A = document.createElement('a');                      // розбір адрес через звичайне посилання
  function parse(h){ A.href = h; return { host:A.host, path:('/' + A.pathname.replace(/^\/+/, '').replace(/index\.html$/, '')).replace(/\/+$/, '') || '/', hash:A.hash }; }
  var here = parse(document.URL);
  /* прелоад на головній показується лише один раз за візит: на будь-якій іншій сторінці позначаємо, що візит уже почався */
  try { if (here.path !== parse(CONFIG.home).path) window.sessionStorage.setItem('dm_pre_done', '1'); } catch(e){}
  function isOn(h){ try{ var u = parse(h); return u.host === here.host && !u.hash && u.path === here.path; }catch(e){ return false; } }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  if (CONFIG.overlay) wrap.classList.add('dmh-over');
  var logoA = $('dmh-logo'), logoImg = logoA.querySelector('img');
  function logoFallback(){ logoA.innerHTML = '<span class="dmh-logotxt">D’AMORE</span>'; }
  logoImg.addEventListener('error', logoFallback);
  if (CONFIG.logo) logoImg.src = CONFIG.logo; else logoFallback();
  $('dmh-logo').setAttribute('href', CONFIG.home);

  function desk(it){
    if (!it.sub) return '<a class="dmh-link' + (isOn(it.h) ? ' on' : '') + '" href="' + esc(it.h) + '">' + esc(it.t) + '</a>';
    return '<div class="dmh-dd"><a class="dmh-link" href="' + esc(it.h) + '" aria-haspopup="true" aria-expanded="false">' + esc(it.t) + CHEV + '</a>' +
           '<div class="dmh-sub" role="menu">' + it.sub.map(function(s){
             return '<a class="dmh-sub-i' + (s.hot ? ' hot' : '') + (s.soon ? ' soon' : '') + '" role="menuitem" href="' + esc(s.h) + '"><span class="t">' +
                    (s.hot ? HEART : '') + esc(s.t) + '</span>' + (s.soon ? '<span class="b">скоро</span>' : '') + '</a>';
           }).join('') + '</div></div>';
  }
  var IG_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.3" cy="6.7" r=".9" fill="currentColor" stroke="none"/></svg>';
  var IG = CONFIG.instagram ? '<a class="dmh-ig" href="' + esc(CONFIG.instagram) + '" target="_blank" rel="noopener" aria-label="Instagram">' + IG_SVG + '</a>' : '';
  L.insertAdjacentHTML('beforeend', CONFIG.left.map(desk).join(''));
  R.insertAdjacentHTML('beforeend',
    CONFIG.right.map(desk).join('') + IG +
    '<a class="dmh-cta" href="' + esc(CONFIG.cta.h) + '"><span>' + esc(CONFIG.cta.t) + '</span></a>' +
    '<a class="dmh-cart" href="' + esc(CONFIG.cart) + '" aria-label="Кошик"><svg viewBox="0 0 24 24"><path d="M5.5 8h13l-1 11.2a1.5 1.5 0 0 1-1.5 1.3H8a1.5 1.5 0 0 1-1.5-1.3L5.5 8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg><span class="dmh-badge" aria-hidden="true"></span></a>');

  /* мобільна панель */
  mob.innerHTML = CONFIG.left.concat(CONFIG.right).map(function(it){
    if (!it.sub) return '<a class="dmh-m-i' + (isOn(it.h) ? ' on' : '') + '" href="' + esc(it.h) + '">' + esc(it.t) + '</a>';
    return '<div class="dmh-m-acc"><button class="dmh-m-i" type="button" aria-expanded="false">' + esc(it.t) + CHEV + '</button><div class="dmh-m-sub">' +
           it.sub.map(function(s){ return '<a' + (s.hot ? ' class="hot"' : '') + ' href="' + esc(s.h) + '">' + esc(s.t) + (s.soon ? '<span class="b">скоро</span>' : '') + '</a>'; }).join('') + '</div></div>';
  }).join('') +
  '<div class="dmh-m-foot"><a class="dmh-cta" href="' + esc(CONFIG.cta.h) + '"><span>' + esc(CONFIG.cta.t) + '</span></a>' +
  '<a class="dmh-m-ig" href="' + esc(CONFIG.instagram) + '" target="_blank" rel="noopener">Instagram</a></div>';

  if (CONFIG.hideTildaCartIcon) document.documentElement.classList.add('dmh-hide-tcart');

  /* ═══════════ лічильник корзини Tilda ═══════════ */
  var cartEl = (R.querySelector ? R : document).querySelector('.dmh-cart');
  var badge  = cartEl ? cartEl.querySelector('.dmh-badge') : null;
  function sumQty(arr){ var n = 0; for (var i = 0; i < arr.length; i++){ var q = parseInt(arr[i] && arr[i].quantity, 10); n += isNaN(q) ? 1 : q; } return n; }
  function cartCount(){
    try {
      var c = window.tcart;
      if (c && c.products && c.products.length) return sumQty(c.products);
      var raw = window.localStorage.getItem('tcart');
      if (raw){ var o = JSON.parse(raw); if (o && o.products && o.products.length) return sumQty(o.products); }
    } catch(e){}
    return 0;
  }
  var lastCnt = -1;
  function updateBadge(){
    if (!badge) return;
    var n = cartCount();
    if (n === lastCnt) return;
    var grew = lastCnt >= 0 && n > lastCnt; lastCnt = n;
    badge.textContent = n > 99 ? '99+' : String(n);
    badge.classList.toggle('on', n > 0);
    cartEl.setAttribute('aria-label', n > 0 ? 'Кошик, товарів: ' + n : 'Кошик');
    if (grew){ badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop'); }
  }
  if (CONFIG.cartCounter && badge){
    updateBadge();
    setInterval(function(){ if (!document.hidden) updateBadge(); }, 700);          // Tilda не повідомляє про зміни – перевіряємо кошик
    window.addEventListener('storage', updateBadge);
    document.addEventListener('visibilitychange', updateBadge);
    document.addEventListener('click', function(){ setTimeout(updateBadge, 350); setTimeout(updateBadge, 1200); }, true);   // після «У кошик»
  }

  /* ═══════════ відкриття кошика Tilda (запасний механізм) ═══════════ */
  /* Tilda сама відкриває кошик за посиланням #order. Якщо за 0,3 с вікно не відкрилось – відкриваємо через функцію або значок Tilda. */
  if (cartEl && CONFIG.cart === '#order'){
    cartEl.addEventListener('click', function(){
      setTimeout(function(){
        var win = document.querySelector('.t706__cartwin');
        if (win && win.classList.contains('t706__cartwin_showed')) return;        // Tilda вже відкрила
        if (!win && CONFIG.cartPage && parse(CONFIG.cartPage).path !== here.path){                // на цій сторінці кошика немає – відкриваємо сторінку магазину з кошиком
          var go = document.createElement('a'); go.href = CONFIG.cartPage + '#order'; document.body.appendChild(go); go.click(); return;
        }
        try { if (typeof window.tcart__openCart === 'function'){ window.tcart__openCart(); return; } } catch(e){}
        var ic = document.querySelector('.t706__carticon, .t706__carticon-wrapper');
        if (ic) ic.click();
      }, 300);
    });
  }

  /* ═══════════ поведінка ═══════════ */
  // меню 2-го рівня: клавіатура/дотик
  var dd = L.querySelector('.dmh-dd');
  if (dd){
    var tr = dd.querySelector('.dmh-link');
    tr.addEventListener('click', function(e){
      if (window.matchMedia('(hover:none)').matches){ e.preventDefault(); dd.classList.toggle('open'); tr.setAttribute('aria-expanded', dd.classList.contains('open')); }
    });
    document.addEventListener('click', function(e){ if (!dd.contains(e.target)) dd.classList.remove('open'); });
    dd.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ dd.classList.remove('open'); tr.focus(); } });
  }
  // прилипання до верху при прокрутці (працює і всередині блоку Tilda)
  var ticking = false;
  function onScroll(){
    if (ticking) return; ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      hd.classList.toggle('stuck', wrap.getBoundingClientRect().top <= 0 || burger.getAttribute('aria-expanded') === 'true');
    });
  }
  window.addEventListener('scroll', onScroll, {passive:true}); window.addEventListener('resize', onScroll);
  // мобільна панель
  function setMenu(open){
    burger.setAttribute('aria-expanded', open); burger.setAttribute('aria-label', open ? 'Закрити меню' : 'Відкрити меню');
    mob.classList.toggle('open', open); mob.setAttribute('aria-hidden', !open);
    document.documentElement.classList.toggle('dmh-lock', open);
    onScroll(); if (open) hd.classList.add('stuck');
  }
  burger.addEventListener('click', function(){ setMenu(burger.getAttribute('aria-expanded') !== 'true'); });
  mob.addEventListener('click', function(e){
    var acc = e.target.closest('.dmh-m-acc > .dmh-m-i');
    if (acc){ var p = acc.parentNode; p.classList.toggle('open'); acc.setAttribute('aria-expanded', p.classList.contains('open')); return; }
    if (e.target.closest('a')) setMenu(false);
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && mob.classList.contains('open')) setMenu(false); });
  window.addEventListener('resize', function(){ if (window.innerWidth > 1024 && mob.classList.contains('open')) setMenu(false); });
  onScroll();
})();
</script>

<!--
  D'AMORE · СТОРІНКА-ЗАГЛУШКА /catalog/body-care (Tilda → T123 «HTML-код», єдиний блок на сторінці)
  ─────────────────────────────────────────────────────────────────────────────
  Текст, фото й кнопка змінюються у блоці CONFIG унизу в <script> (та в HTML вище).
  Напис «Вибач, люба.» — контури шрифту Imperial у SVG, окремо хостити шрифт не треба.
-->
<style>
  .dm-st{
    --red:#AB3724; --burg:#5B1210; --graph:#433d3c; --cream:#F6F2EE; --script:#c06c5e;
    position:relative; overflow:hidden; isolation:isolate; background:var(--cream); color:var(--graph);
    min-height:max(640px,84svh); display:flex; align-items:center;
    padding:clamp(86px,12vh,130px) 0 clamp(60px,9vh,110px); font-family:'Onest','Helvetica Neue',Arial,sans-serif;
  }
  .dm-st-bg{position:absolute; inset:0; z-index:-1; overflow:hidden}
  .dm-st-bg i{position:absolute; inset:0 -3.5% 0 0; background:var(--cream) left center/cover no-repeat}
  .dm-st-bg::after{content:''; position:absolute; inset:0; background:radial-gradient(60% 70% at 28% 50%, rgba(255,255,255,.62), transparent 72%), linear-gradient(180deg,rgba(246,242,238,.85) 0%,rgba(246,242,238,0) 18%,rgba(246,242,238,0) 82%,rgba(246,242,238,.9) 100%)}
  .dm-st-in{
    width:100%; max-width:1360px; margin:0 auto; padding:0 clamp(24px,7vw,120px);
    display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.8fr); align-items:center; gap:clamp(34px,6vw,110px);
  }

  /* ───── текст ───── */
  .dm-st-hello{
    display:block; width:clamp(210px,25vw,400px); height:auto; margin:0 0 clamp(4px,.5vw,12px) -.6vw; overflow:visible;
    -webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 60%); mask-image:linear-gradient(90deg,#000 40%,transparent 60%);
    -webkit-mask-size:260% 100%; mask-size:260% 100%; -webkit-mask-position:100% 0; mask-position:100% 0; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    transition:-webkit-mask-position 1.8s cubic-bezier(.5,0,.2,1) .15s, mask-position 1.8s cubic-bezier(.5,0,.2,1) .15s;
  }
  .dm-st.in .dm-st-hello{-webkit-mask-position:0 0; mask-position:0 0}
  .dm-st-hello path{fill:var(--script)}
  .dm-st-r{opacity:0; transform:translate3d(0,20px,0); filter:blur(6px); transition:opacity .9s cubic-bezier(.2,.7,.2,1) var(--d,0s), transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0s), filter .9s ease var(--d,0s)}
  .dm-st.in .dm-st-r{opacity:1; transform:none; filter:none}
  .dm-st-h{margin:0 0 .5em; font:500 clamp(34px,4.5vw,76px)/1.04 'Onest',sans-serif; letter-spacing:-.026em; color:var(--burg)}
  .dm-st-p{margin:0 0 clamp(28px,4vh,46px); font:300 clamp(17px,1.7vw,26px)/1.5 'Onest',sans-serif; letter-spacing:-.012em; max-width:24em}
  .dm-st-p span{display:block}
  .dm-st-btn{
    --c1:#7A1D14; --c2:#B4422F; --c3:#8E271B; --c4:#CF6A55;
    position:relative; display:inline-flex; align-items:center; gap:12px; padding:17px 38px; border-radius:99px; overflow:hidden; isolation:isolate;
    font:500 15.5px/1 'Onest',sans-serif; letter-spacing:.06em; color:#FFF4EC; text-decoration:none; background:var(--c1); -webkit-tap-highlight-color:transparent;
    box-shadow:0 16px 30px -14px rgba(122,29,20,.75), inset 0 1px 0 rgba(255,225,215,.38), inset 0 -8px 14px rgba(50,6,4,.26);
    transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s ease;
  }
  .dm-st-btn span,.dm-st-btn svg{position:relative; z-index:2; text-shadow:0 1px 2px rgba(60,8,4,.35)}
  .dm-st-btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .dm-st-btn:hover svg{transform:translateX(5px)}
  .dm-st-btn::before{
    content:''; position:absolute; inset:-60% -25%; z-index:-2;
    background:
      radial-gradient(60% 90% at 25% 30%, rgba(255,205,190,.55), transparent 60%),
      radial-gradient(55% 80% at 75% 70%, rgba(255,190,175,.40), transparent 62%),
      linear-gradient(100deg,var(--c1) 0%,var(--c2) 22%,var(--c3) 38%,var(--c4) 55%,var(--c3) 72%,var(--c2) 88%,var(--c1) 100%);
    background-size:180% 180%,200% 200%,240% 100%; animation:dmstSilk 7s ease-in-out infinite alternate;
  }
  @keyframes dmstSilk{0%{background-position:0% 0%,100% 100%,0% 0%} 100%{background-position:100% 100%,0% 0%,100% 0%}}
  .dm-st-btn::after{
    content:''; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(105deg,transparent 34%,rgba(255,236,226,0) 40%,rgba(255,236,226,.55) 50%,rgba(255,236,226,0) 60%,transparent 66%);
    transform:translateX(-130%) skewX(-12deg); animation:dmstSheen 5s cubic-bezier(.5,0,.3,1) 1.4s infinite;
  }
  @keyframes dmstSheen{0%{transform:translateX(-130%) skewX(-12deg)} 55%,100%{transform:translateX(130%) skewX(-12deg)}}
  .dm-st-btn:hover{transform:translateY(-3px)}
  .dm-st-btn:focus-visible{outline:2px solid var(--red); outline-offset:4px}

  /* ───── фото на мокко-підложці ───── */
  .dm-st-photo{position:relative; width:100%; max-width:520px; margin-left:auto}
  .dm-st-photo::before{                                   /* підложка мокко → світле, зі зсувом */
    content:''; position:absolute; inset:0; border-radius:clamp(26px,3vw,40px); transform:translate(clamp(12px,1.6vw,24px),clamp(12px,1.6vw,24px)) rotate(2.2deg);

  .dm-ft-l{position:relative; display:inline-block; font:300 16px/1.3 'Onest',sans-serif; color:rgba(246,242,238,.88); transition:color .3s ease}
  .dm-ft-l::after{content:''; position:absolute; left:0; right:0; bottom:-3px; height:1px; background:var(--coral); transform:scaleX(0); transform-origin:left; transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .dm-ft-l:hover{color:var(--coral)} .dm-ft-l:hover::after{transform:scaleX(1)}
  .dm-ft a:focus-visible{outline:2px solid var(--coral); outline-offset:4px; border-radius:4px}
  .dm-ft-l.soon{color:rgba(246,242,238,.38); pointer-events:none; cursor:default}
  .dm-ft-l.soon i{font-style:normal; margin-left:8px; padding:3px 8px; border-radius:99px; font:500 10px/1 'Onest',sans-serif; letter-spacing:.1em; text-transform:uppercase; color:rgba(246,242,238,.5); box-shadow:inset 0 0 0 1px rgba(246,242,238,.25)}

  .dm-ft-contact{display:grid; gap:12px; margin:0 0 22px; font:300 16px/1.4 'Onest',sans-serif}
  .dm-ft-contact span{display:block; margin-bottom:3px; font:500 11.5px/1 'Onest',sans-serif; letter-spacing:.12em; text-transform:uppercase; color:rgba(246,242,238,.5)}
  .dm-ft-soc{display:flex; flex-wrap:wrap; gap:10px}
  .dm-ft-soc a{width:44px; height:44px; display:grid; place-items:center; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(246,242,238,.28); color:var(--cream); transition:background .35s ease, color .35s ease, box-shadow .35s ease, transform .35s cubic-bezier(.2,.8,.2,1)}
  .dm-ft-soc a:hover{background:var(--coral); color:#2b1712; box-shadow:none; transform:translateY(-3px)}
  .dm-ft-soc svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  .dm-ft-soc svg .f{fill:currentColor; stroke:none}

  .dm-ft-cta{
    --c1:#7A1D14; --c2:#B4422F; --c3:#8E271B; --c4:#CF6A55;
    position:relative; display:inline-flex; align-items:center; gap:12px; padding:15px 32px; border-radius:99px; overflow:hidden; isolation:isolate; box-sizing:border-box;
    font:500 14.5px/1 'Onest',sans-serif; letter-spacing:.06em; color:#FFF4EC; background:var(--c1);
    box-shadow:0 14px 28px -14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,225,215,.38), inset 0 -8px 14px rgba(50,6,4,.26); transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .dm-ft-cta span,.dm-ft-cta svg{position:relative; z-index:2}
  .dm-ft-cta svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .dm-ft-cta:hover{transform:translateY(-3px)} .dm-ft-cta:hover svg{transform:translateX(5px)}
  .dm-ft-cta::before{content:''; position:absolute; inset:-60% -25%; z-index:-1;
    background:radial-gradient(60% 90% at 25% 30%, rgba(255,205,190,.55), transparent 60%), linear-gradient(100deg,var(--c1) 0%,var(--c2) 22%,var(--c3) 40%,var(--c4) 56%,var(--c3) 74%,var(--c1) 100%);
    background-size:180% 180%,240% 100%; animation:dmftSilk 7s ease-in-out infinite alternate}
  @keyframes dmftSilk{0%{background-position:0% 0%,0% 0%} 100%{background-position:100% 100%,100% 0%}}

  .dm-ft-bot{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 28px; padding:22px 0 26px; border-top:1px solid rgba(246,242,238,.14); font:300 13px/1.5 'Onest',sans-serif; color:rgba(246,242,238,.55)}
  .dm-ft-bot a{color:rgba(246,242,238,.55); transition:color .3s ease} .dm-ft-bot a:hover{color:var(--coral)}
  .dm-ft-legal{display:flex; flex-wrap:wrap; gap:6px 22px}
  .dm-ft-up{display:inline-flex; align-items:center; gap:8px; cursor:pointer; background:none; border:0; padding:0; font:inherit; color:rgba(246,242,238,.75); transition:color .3s ease}
  .dm-ft-up:hover{color:var(--coral)}
  .dm-ft-up svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

  @media (max-width:980px){
    .dm-ft-top{grid-template-columns:1fr 1fr}
    .dm-ft-brand{grid-column:1/-1}
  }
  @media (max-width:560px){
    .dm-ft-top{grid-template-columns:1fr 1fr; gap:34px 20px}
    .dm-ft-contact-col{grid-column:1/-1}
    .dm-ft-bot{flex-direction:column; align-items:flex-start}
  }
  @media (prefers-reduced-motion:reduce){ .dm-ft-cta::before{animation:none} }
</style>

<footer id="dm-ft" class="dm-ft" aria-label="Футер">
  <div class="dm-ft-in">
    <div class="dm-ft-top">
      <div class="dm-ft-brand">
        <a class="dm-ft-logo" href="../../" aria-label="D’AMORE"><span class="dm-ft-logotxt">D’AMORE</span></a>
        <p class="dm-ft-script">Because you deserve it.</p>
        <p class="dm-ft-about">Професійний догляд за волоссям для жінок, які не хочуть ставити життя на pause.</p>
        <a class="dm-ft-cta" href="../../catalog/"><span>Обрати догляд</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </div>
      <nav aria-label="Магазин"><h3 class="dm-ft-h">Магазин</h3><ul id="dm-ft-shop"></ul></nav>
      <nav aria-label="Інформація"><h3 class="dm-ft-h">Інформація</h3><ul id="dm-ft-info"></ul></nav>
      <div class="dm-ft-contact-col"><h3 class="dm-ft-h">Контакти</h3><div class="dm-ft-contact" id="dm-ft-contact"></div><div class="dm-ft-soc" id="dm-ft-soc"></div></div>
    </div>
    <div class="dm-ft-bot">
      <span id="dm-ft-copy"></span>
      <span class="dm-ft-legal" id="dm-ft-legal"></span>
      <button class="dm-ft-up" type="button" id="dm-ft-up">Нагору <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>
  </div>
</footer>

<script>
(function(){
  'use strict';

  /* ═══════════ CONFIG ═══════════ */
  var CFG = {
    /* логотип: якщо файл світлий/прозорий – вказати його посилання. Порожньо = текст D’AMORE */
    logo : '../../assets/img/logo_damore.png',

    shop : [                                         // колонка «Магазин»
      { t:'Холодна реконструкція',    h:'../../catalog/cold-reconstruction/' },
      { t:'Усі розділи',              h:'../../catalog/' },
      { t:'Домашній догляд',          h:'../../catalog/home-care/',   soon:true },
      { t:'Догляд за тілом',          h:'../../catalog/body-care/',   soon:true },
      { t:'Аксесуари',                h:'../../catalog/accessories/', soon:true },
      { t:'Сертифікати та подарунки', h:'../../catalog/gifts/',       soon:true }
    ],
    info : [                                         // колонка «Інформація»
      { t:'Про бренд',          h:'../../about/' },
      { t:'Блог',               h:'../../blog/' },
      { t:'Доставка й оплата',  h:'#demo' },        // ← створити сторінку або змінити адресу
      { t:'Повернення й обмін', h:'#demo' },         // ← те саме
      { t:'Питання й відповіді', h:'#demo' }             // ← те саме
    ],
    contact : [                                      // порожнє значення – рядок зникне
      { l:'Телефон',  t:'+38 0__ ___ __ __', h:'tel:+380000000000' },   // ← ВПИСАТИ СВІЙ НОМЕР (в обох полях)
      { l:'Пошта',    t:'hello@damore.ua',  h:'mailto:hello@damore.ua' }, // ← ВПИСАТИ СВОЮ ПОШТУ
      { l:'Графік',   t:'Пн–Пт, 10:00–18:00' }                             // ← або прибрати
    ],
    social : {                                       // порожнє = іконки не буде
      instagram: 'https://www.instagram.com/the_trend.studio_storoj/',
      tiktok   : '',
      telegram : '',
      facebook : ''
    },
    legal : [                                        // нижній рядок
      { t:'Публічна оферта',          h:'#demo' },          // ← потрібні сторінки для магазину в Україні
      { t:'Політика конфіденційності', h:'#demo' }
    ],
    copy : 'D’AMORE · Trend Studio'                  // після © і року
  };

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function $(id){ return document.getElementById(id); }

  if (CFG.logo){
    var im = new Image(); im.alt = 'D’AMORE';
    im.onload = function(){ var a = document.querySelector('.dm-ft-logo'); a.innerHTML = ''; a.appendChild(im); };
    im.src = CFG.logo;
  }
  function links(list){
    return list.map(function(x){
      if (x.soon) return '<li><span class="dm-ft-l soon">' + esc(x.t) + '<i>скоро</i></span></li>';
      return '<li><a class="dm-ft-l" href="' + esc(x.h) + '">' + esc(x.t) + '</a></li>';
    }).join('');
  }
  $('dm-ft-shop').innerHTML = links(CFG.shop);
  $('dm-ft-info').innerHTML = links(CFG.info);
  $('dm-ft-contact').innerHTML = CFG.contact.filter(function(c){ return c.t; }).map(function(c){
    return '<div><span>' + esc(c.l) + '</span>' + (c.h ? '<a class="dm-ft-l" href="' + esc(c.h) + '">' + esc(c.t) + '</a>' : esc(c.t)) + '</div>';
  }).join('');

  var ICON = {
    instagram: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle class="f" cx="17.3" cy="6.7" r=".9"/></svg>',
    tiktok:    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.2a3.7 3.7 0 1 1-3.7-3.7"/><path d="M14 3c.3 2.6 2 4.4 4.6 4.6"/></svg>',
    telegram:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4L3 11l6 2.3L11.5 20l3-4.2L19 19.5z"/><path d="M9 13.3l9-6.8"/></svg>',
    facebook:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8.5h2.5V5H14c-2.2 0-3.5 1.4-3.5 3.5V11H8v3.5h2.5V21H14v-6.5h2.4l.6-3.5H14V9.2c0-.5.2-.7 1-.7z"/></svg>'
  };
  $('dm-ft-soc').innerHTML = Object.keys(CFG.social).filter(function(k){ return CFG.social[k]; }).map(function(k){
    return '<a href="' + esc(CFG.social[k]) + '" target="_blank" rel="noopener" aria-label="' + k + '">' + ICON[k] + '</a>';
  }).join('');

  $('dm-ft-copy').textContent = '© ' + new Date().getFullYear() + ' ' + CFG.copy;
  $('dm-ft-legal').innerHTML = CFG.legal.map(function(x){ return '<a href="' + esc(x.h) + '">' + esc(x.t) + '</a>'; }).join('');
  $('dm-ft-up').addEventListener('click', function(){ window.scrollTo({ top:0, behavior:'smooth' }); });
})();
</script>

<script src="../../assets/demo.js"></script>
</body>
