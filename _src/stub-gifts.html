  ─────────────────────────────────────────────────────────────────────────────
  Текст, фото й кнопка змінюються у блоці CONFIG унизу в <script> (та в HTML вище).
  Напис «Вибач, люба.» — контури шрифту Imperial у SVG, окремо хостити шрифт не треба.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  .dm-st{
    --red:#AB3724; --burg:#5B1210; --graph:#433d3c; --cream:#F6F2EE; --script:#c06c5e;
    position:relative; overflow:hidden; isolation:isolate; background:var(--cream); color:var(--graph);
    min-height:max(640px,84svh); display:flex; align-items:center;
    padding:clamp(86px,12vh,130px) 0 clamp(60px,9vh,110px); font-family:'Onest','Helvetica Neue',Arial,sans-serif;
  }
  .dm-st-bg{position:absolute; inset:0; z-index:-1; overflow:hidden}
  .dm-st-bg i{position:absolute; inset:0 -3.5% 0 0; background:var(--cream) left center/cover no-repeat}
  .dm-st-bg::after{content:''; position:absolute; inset:0; background:radial-gradient(60% 70% at 28% 50%, rgba(255,255,255,.62), transparent 72%), linear-gradient(180deg,rgba(246,242,238,.85) 0%,rgba(246,242,238,0) 18%,rgba(246,242,238,0) 82%,rgba(246,242,238,.9) 100%)}
  .dm-st-in{
    width:100%; max-width:1360px; margin:0 auto; padding:0 clamp(24px,7vw,120px);
    display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.8fr); align-items:center; gap:clamp(34px,6vw,110px);
  }

  /* ───── текст ───── */
  .dm-st-hello{
    display:block; width:clamp(210px,25vw,400px); height:auto; margin:0 0 clamp(4px,.5vw,12px) -.6vw; overflow:visible;
    -webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 60%); mask-image:linear-gradient(90deg,#000 40%,transparent 60%);
    -webkit-mask-size:260% 100%; mask-size:260% 100%; -webkit-mask-position:100% 0; mask-position:100% 0; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    transition:-webkit-mask-position 1.8s cubic-bezier(.5,0,.2,1) .15s, mask-position 1.8s cubic-bezier(.5,0,.2,1) .15s;
  }
  .dm-st.in .dm-st-hello{-webkit-mask-position:0 0; mask-position:0 0}
  .dm-st-hello path{fill:var(--script)}
  .dm-st-r{opacity:0; transform:translate3d(0,20px,0); filter:blur(6px); transition:opacity .9s cubic-bezier(.2,.7,.2,1) var(--d,0s), transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0s), filter .9s ease var(--d,0s)}
  .dm-st.in .dm-st-r{opacity:1; transform:none; filter:none}
  .dm-st-h{margin:0 0 .5em; font:500 clamp(34px,4.5vw,76px)/1.04 'Onest',sans-serif; letter-spacing:-.026em; color:var(--burg)}
  .dm-st-p{margin:0 0 clamp(28px,4vh,46px); font:300 clamp(17px,1.7vw,26px)/1.5 'Onest',sans-serif; letter-spacing:-.012em; max-width:24em}
  .dm-st-p span{display:block}
  .dm-st-btn{
    --c1:#7A1D14; --c2:#B4422F; --c3:#8E271B; --c4:#CF6A55;
    position:relative; display:inline-flex; align-items:center; gap:12px; padding:17px 38px; border-radius:99px; overflow:hidden; isolation:isolate;
    font:500 15.5px/1 'Onest',sans-serif; letter-spacing:.06em; color:#FFF4EC; text-decoration:none; background:var(--c1); -webkit-tap-highlight-color:transparent;
    box-shadow:0 16px 30px -14px rgba(122,29,20,.75), inset 0 1px 0 rgba(255,225,215,.38), inset 0 -8px 14px rgba(50,6,4,.26);
    transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s ease;
  }
  .dm-st-btn span,.dm-st-btn svg{position:relative; z-index:2; text-shadow:0 1px 2px rgba(60,8,4,.35)}
  .dm-st-btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .dm-st-btn:hover svg{transform:translateX(5px)}
  .dm-st-btn::before{
    content:''; position:absolute; inset:-60% -25%; z-index:-2;
    background:
      radial-gradient(60% 90% at 25% 30%, rgba(255,205,190,.55), transparent 60%),
      radial-gradient(55% 80% at 75% 70%, rgba(255,190,175,.40), transparent 62%),
      linear-gradient(100deg,var(--c1) 0%,var(--c2) 22%,var(--c3) 38%,var(--c4) 55%,var(--c3) 72%,var(--c2) 88%,var(--c1) 100%);
    background-size:180% 180%,200% 200%,240% 100%; animation:dmstSilk 7s ease-in-out infinite alternate;
  }
  @keyframes dmstSilk{0%{background-position:0% 0%,100% 100%,0% 0%} 100%{background-position:100% 100%,0% 0%,100% 0%}}
  .dm-st-btn::after{
    content:''; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(105deg,transparent 34%,rgba(255,236,226,0) 40%,rgba(255,236,226,.55) 50%,rgba(255,236,226,0) 60%,transparent 66%);
    transform:translateX(-130%) skewX(-12deg); animation:dmstSheen 5s cubic-bezier(.5,0,.3,1) 1.4s infinite;
  }
  @keyframes dmstSheen{0%{transform:translateX(-130%) skewX(-12deg)} 55%,100%{transform:translateX(130%) skewX(-12deg)}}
  .dm-st-btn:hover{transform:translateY(-3px)}
  .dm-st-btn:focus-visible{outline:2px solid var(--red); outline-offset:4px}

  /* ───── фото на мокко-підложці ───── */
  .dm-st-photo{position:relative; width:100%; max-width:520px; margin-left:auto}
  .dm-st-photo::before{                                   /* підложка мокко → світле, зі зсувом */
    content:''; position:absolute; inset:0; border-radius:clamp(26px,3vw,40px); transform:translate(clamp(12px,1.6vw,24px),clamp(12px,1.6vw,24px)) rotate(2.2deg);
    background:linear-gradient(160deg,#B3A094 0%,#CDBFB3 50%,#EFE9E3 100%); opacity:0; transition:opacity 1.2s ease .5s, transform 1.4s cubic-bezier(.2,.7,.2,1) .5s;
  }
  .dm-st.in .dm-st-photo::before{opacity:1}
  .dm-st-card{
    position:relative; aspect-ratio:4/5; border-radius:clamp(26px,3vw,40px); overflow:hidden; background:#d8cdc2;
    box-shadow:0 46px 70px -34px rgba(67,40,30,.6), 0 8px 22px -12px rgba(67,40,30,.25), inset 0 0 0 1px rgba(255,255,255,.55);
    clip-path:inset(100% 0 0 0 round clamp(26px,3vw,40px)); transition:clip-path 1.5s cubic-bezier(.65,0,.2,1) .25s;
    animation:dmstFloat 8s ease-in-out 2s infinite alternate;
  }
  .dm-st.in .dm-st-card{clip-path:inset(0 0 0 0 round clamp(26px,3vw,40px))}
  @keyframes dmstFloat{from{transform:translateY(0)} to{transform:translateY(-8px)}}
  .dm-st-img{position:absolute; inset:0; background:center/cover no-repeat; transform:scale(1.14); transition:transform 2.2s cubic-bezier(.2,.7,.2,1) .25s}
  .dm-st.in .dm-st-img{transform:scale(1.02)}
  .dm-st-card::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(46,31,26,0) 55%,rgba(46,31,26,.35) 100%); pointer-events:none}
  .dm-st-tag{
    position:absolute; left:18px; top:18px; z-index:2; display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:99px;
    font:500 11.5px/1 'Onest',sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--graph);
    background:rgba(246,242,238,.86); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .dm-st-tag svg{width:11px; height:11px; fill:var(--red); animation:dmstBeat 1.9s ease-in-out infinite}
  @keyframes dmstBeat{0%{transform:scale(1)} 14%{transform:scale(1.22)} 28%{transform:scale(1)} 42%{transform:scale(1.12)} 70%,100%{transform:scale(1)}}

  @media (max-width:900px){
    .dm-st{min-height:0; padding-top:clamp(90px,14vh,120px)}
    .dm-st-in{grid-template-columns:1fr; gap:42px; padding:0 clamp(22px,6vw,40px)}
    .dm-st-photo{max-width:420px; margin:0 auto}
    .dm-st-hello{width:clamp(200px,58vw,300px)}
    .dm-st-btn{width:100%; max-width:380px; justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){ .dm-st-card{animation:none} }
</style>
