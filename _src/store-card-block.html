<!--
  D'AMORE · КАРТКА ТОВАРУ (статична заглушка для портфоліо; у живому сайті це штатний блок «Магазин» Tilda)
  Id блоку rec4537654003 і клас js-store-prod-btn потрібні, щоб кнопки «Додати до кошика» в hero й вкладках його натискали.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  .dm-sc{
    --red:#AB3724; --burg:#5B1210; --graph:#433d3c; --cream:#F6F2EE;
    background:var(--cream); color:var(--graph); font-family:'Onest','Helvetica Neue',Arial,sans-serif;
    padding:clamp(40px,5vw,80px) clamp(18px,4vw,60px);
  }
  .dm-sc-in{max-width:1100px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(24px,4vw,64px); align-items:center}
  .dm-sc-img{aspect-ratio:1/1; border-radius:clamp(22px,2.4vw,30px); background:#d8cdc2 center/cover no-repeat; box-shadow:0 36px 60px -36px rgba(67,40,30,.55)}
  .dm-sc-h{margin:0 0 8px; font:500 clamp(28px,3vw,44px)/1.1 'Onest',sans-serif; letter-spacing:-.024em; color:var(--burg)}
  .dm-sc-h em{font-style:normal; color:var(--red)}
  .dm-sc-s{margin:0 0 18px; font:300 clamp(18px,1.6vw,22px)/1.3 'Onest',sans-serif}
  .dm-sc-p{margin:0 0 20px; font:500 clamp(22px,2vw,28px)/1 'Onest',sans-serif; color:var(--red)}
  .dm-sc-d{margin:0 0 24px; max-width:30em; font:300 17px/1.55 'Onest',sans-serif}
  .dm-sc-btn{
    --c1:#7A1D14; --c2:#B4422F; --c3:#8E271B; --c4:#CF6A55;
    position:relative; display:inline-flex; align-items:center; padding:16px 36px; border:0; border-radius:99px; cursor:pointer; overflow:hidden; isolation:isolate;
    font:500 15px/1 'Onest',sans-serif; letter-spacing:.06em; color:#FFF4EC; background:var(--c1); -webkit-tap-highlight-color:transparent;
    box-shadow:0 14px 28px -14px rgba(122,29,20,.75), inset 0 1px 0 rgba(255,225,215,.38), inset 0 -8px 14px rgba(50,6,4,.26); transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .dm-sc-btn::before{content:''; position:absolute; inset:-60% -25%; z-index:-1;
    background:radial-gradient(60% 90% at 25% 30%, rgba(255,205,190,.55), transparent 60%), linear-gradient(100deg,var(--c1) 0%,var(--c2) 22%,var(--c3) 40%,var(--c4) 56%,var(--c3) 74%,var(--c1) 100%);
    background-size:180% 180%,240% 100%; animation:dmscSilk 7s ease-in-out infinite alternate}
  @keyframes dmscSilk{0%{background-position:0% 0%,0% 0%} 100%{background-position:100% 100%,100% 0%}}
  .dm-sc-btn:hover{transform:translateY(-3px)}
  .dm-sc-btn:focus-visible{outline:2px solid var(--red); outline-offset:4px}
  @media (max-width:800px){ .dm-sc-in{grid-template-columns:1fr} .dm-sc-btn{width:100%; justify-content:center} }
  @media (prefers-reduced-motion:reduce){ .dm-sc-btn::before{animation:none} }
</style>

<section id="rec4537654003" class="dm-sc" aria-label="Товар">
  <div class="dm-sc-in">
    <div class="dm-sc-img" style="background-image:url('@@/assets/img/1cold.jpg')"></div>
    <div>
      <h2 class="dm-sc-h">Холодна реконструкція <em>D’AMORE</em></h2>
      <p class="dm-sc-s">5-етапний догляд</p>
      <p class="dm-sc-p">2000 ₴</p>
      <p class="dm-sc-d">Салонний догляд, який не потребує салону. 5 засобів, 5 кроків — і волосся знову гладке, блискуче й слухняне. Без поспіху. Без запису «на потім». Просто твій Moment for me.</p>
      <button class="dm-sc-btn t-btn js-store-prod-btn" type="button">Додати до кошика</button>
    </div>
  </div>
</section>
