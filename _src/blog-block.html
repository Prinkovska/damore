<!--
  D'AMORE · БЛОГ (статична версія для портфоліо; у живому сайті цей блок — штатний «Потік» Tilda)
  Три картки дописів. Тексти й фото — у масиві POSTS унизу.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  .dm-bl{
    --red:#AB3724; --burg:#5B1210; --graph:#433d3c; --cream:#F6F2EE;
    background:var(--cream); color:var(--graph); font-family:'Onest','Helvetica Neue',Arial,sans-serif;
    padding:clamp(56px,7vw,110px) clamp(18px,4vw,60px);
  }
  .dm-bl-in{max-width:1240px; margin:0 auto}
  .dm-bl-head{text-align:center; max-width:760px; margin:0 auto clamp(30px,4vw,52px)}
  .dm-bl-tag{margin:0 0 14px; font:500 12.5px/1 'Onest',sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--red)}
  .dm-bl-h{margin:0 0 .4em; font:500 clamp(30px,3.8vw,56px)/1.06 'Onest',sans-serif; letter-spacing:-.026em; color:var(--burg)}
  .dm-bl-h em{font-style:normal; color:var(--red)}
  .dm-bl-sub{margin:0; font:300 clamp(16px,1.4vw,20px)/1.5 'Onest',sans-serif; letter-spacing:-.012em}
  .dm-bl-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(14px,2vw,28px)}
  .dm-bl-card{
    display:flex; flex-direction:column; border-radius:clamp(22px,2.4vw,30px); overflow:hidden; background:#fff; color:inherit; text-decoration:none;
    box-shadow:0 26px 50px -34px rgba(67,40,30,.5), inset 0 0 0 1px rgba(67,61,60,.06);
    transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
  }
  .dm-bl-card:hover{transform:translateY(-6px); box-shadow:0 36px 60px -34px rgba(67,40,30,.6), inset 0 0 0 1px rgba(67,61,60,.06)}
  .dm-bl-card:focus-visible{outline:2px solid var(--red); outline-offset:4px}
  .dm-bl-img{aspect-ratio:16/11; background:#d8cdc2 center/cover no-repeat; transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
  .dm-bl-card:hover .dm-bl-img{transform:scale(1.04)}
  .dm-bl-imgw{overflow:hidden}
  .dm-bl-body{display:flex; flex-direction:column; flex:1; padding:clamp(18px,2vw,26px)}
  .dm-bl-t{margin:0 0 10px; font:500 clamp(18px,1.55vw,22px)/1.25 'Onest',sans-serif; letter-spacing:-.014em; color:var(--burg)}
  .dm-bl-d{margin:0 0 16px; font:300 15.5px/1.55 'Onest',sans-serif; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .dm-bl-date{margin-top:auto; font:400 13px/1 'Onest',sans-serif; color:rgba(67,61,60,.65)}
  .dm-bl-more{margin:12px 0 0; font:500 15px/1 'Onest',sans-serif; letter-spacing:.03em; color:var(--red)}
  .dm-bl-more span{display:inline-block; transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  .dm-bl-card:hover .dm-bl-more span{transform:translateX(5px)}
  .dm-bl-all{display:flex; justify-content:center; margin-top:clamp(26px,3.4vw,44px)}
  .dm-bl-btn{display:inline-flex; align-items:center; padding:16px 36px; border-radius:99px; border:1.5px solid var(--graph); font:500 15px/1 'Onest',sans-serif; letter-spacing:.05em; color:var(--graph); text-decoration:none; transition:background .4s ease, color .4s ease, transform .4s cubic-bezier(.2,.8,.2,1)}
  .dm-bl-btn:hover{background:var(--graph); color:var(--cream); transform:translateY(-2px)}
  .dm-bl-btn:focus-visible{outline:2px solid var(--red); outline-offset:4px}
  @media (max-width:900px){ .dm-bl-grid{grid-template-columns:1fr; max-width:520px; margin:0 auto} }
</style>

<section id="dm-bl" class="dm-bl" aria-label="Блог">
  <div class="dm-bl-in">
    <div class="dm-bl-head">
      <p class="dm-bl-tag">Блог</p>
      <h2 class="dm-bl-h">Тут говоримо <em>про волосся</em> без складних правил</h2>
      <p class="dm-bl-sub">Про догляд, відновлення і ті маленькі моменти, які варто залишати не на потім.</p>
    </div>
    <div class="dm-bl-grid" id="dm-bl-grid"></div>
    <div class="dm-bl-all"><a class="dm-bl-btn" href="@@/blog/">Усі статті</a></div>
  </div>
</section>

<script>
(function(){
  'use strict';
  var POSTS = [
    { t:'Волосся стало сухим і ламким? Можливо, йому не потрібен ще один шампунь', d:'Коли звичний догляд уже не дає бажаного результату, варто подивитися глибше — на стан структури волосся.', date:'05.10.2026', img:'@@/assets/img/about-hero.jpg' },
    { t:'Чому після реконструкції волосся легше розчісується?', d:'Гладке волосся — це не тільки про красивий вигляд. Делікатне розчісування теж є частиною правильного догляду.', date:'05.10.2026', img:'@@/assets/img/4accessories.jpg' },
    { t:'Немає часу на салон? 30 хвилин для волосся можуть стати твоїм часом для себе', d:'Професійний догляд не обов’язково означає кілька годин у салоні. Його можна вписати у свій ритм.', date:'05.10.2026', img:'@@/assets/img/story-preview.jpg' }
  ];
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  document.getElementById('dm-bl-grid').innerHTML = POSTS.map(function(p){
    return '<a class="dm-bl-card" href="#demo"><div class="dm-bl-imgw"><div class="dm-bl-img" style="background-image:url(\'' + p.img + '\')"></div></div>' +
           '<div class="dm-bl-body"><h3 class="dm-bl-t">' + esc(p.t) + '</h3><p class="dm-bl-d">' + esc(p.d) + '</p><span class="dm-bl-date">' + esc(p.date) + '</span><p class="dm-bl-more">Читати далі <span>→</span></p></div></a>';
  }).join('');
})();
</script>
